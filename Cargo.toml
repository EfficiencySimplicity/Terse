[package]
name = "Terse"
version = "0.1.0"
edition = "2024"

[dependencies]
bytesize = "2.3.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["full"] }
indoc = "2"
url = "2.5.8"
anyhow = "1.0.102"
